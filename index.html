<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --accent: #007aff;
      --accent-hover: #0062cc;
      --border: #e5e5ea;
      --done: #8e8e93;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    #todo-input:focus { border-color: var(--accent); }

    button {
      cursor: pointer;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      transition: background 0.15s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .filters {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .filter {
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
    }

    .filter.active {
      background: #f0f0f3;
      color: var(--text);
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }

    li:last-child { border-bottom: none; }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .checkbox:hover { border-color: var(--accent); }
    .checkbox.done { background: var(--accent); border-color: var(--accent); }
    .checkbox.done::after {
      content: "✓";
      color: white;
      font-size: 13px;
      line-height: 1;
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: var(--done);
    }

    .delete-btn {
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 18px;
      line-height: 1;
    }

    .delete-btn:hover { background: #ffe5e5; color: #ff3b30; }

    .empty {
      text-align: center;
      padding: 32px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .counter {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todos</h1>

    <form class="input-row" id="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="todo-list"></ul>
    <div id="empty" class="empty" hidden>Nothing here yet.</div>
    <div class="counter" id="counter"></div>
  </main>

  <script>
    const STORAGE_KEY = "todo-app-new.v1";
    const state = {
      todos: loadTodos(),
      filter: "all",
    };

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const listEl = document.getElementById("todo-list");
    const emptyEl = document.getElementById("empty");
    const counterEl = document.getElementById("counter");
    const filtersEl = document.getElementById("filters");

    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.todos));
      } catch {
        // Storage may be unavailable (private mode, quota); fail silently.
      }
    }

    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      state.todos.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text: trimmed,
        done: false,
        createdAt: Date.now(),
      });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      const todo = state.todos.find((t) => t.id === id);
      if (!todo) return;
      todo.done = !todo.done;
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      state.todos = state.todos.filter((t) => t.id !== id);
      saveTodos();
      render();
    }

    function setFilter(filter) {
      state.filter = filter;
      for (const btn of filtersEl.querySelectorAll(".filter")) {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      }
      render();
    }

    function visibleTodos() {
      if (state.filter === "active") return state.todos.filter((t) => !t.done);
      if (state.filter === "done") return state.todos.filter((t) => t.done);
      return state.todos;
    }

    function render() {
      const items = visibleTodos();
      listEl.innerHTML = "";

      for (const todo of items) {
        const li = document.createElement("li");
        li.dataset.todoId = todo.id;

        const checkbox = document.createElement("div");
        checkbox.className = "checkbox" + (todo.done ? " done" : "");
        checkbox.setAttribute("role", "checkbox");
        checkbox.setAttribute("aria-checked", String(todo.done));
        checkbox.addEventListener("click", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.className = "todo-text" + (todo.done ? " done" : "");
        text.textContent = todo.text;
        text.title = "Click to edit";
        text.addEventListener("click", () => startEditing(todo.id));

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.setAttribute("aria-label", "Delete todo");
        del.textContent = "×";
        del.addEventListener("click", () => deleteTodo(todo.id));

        li.append(checkbox, text, del);
        listEl.appendChild(li);
      }

      emptyEl.hidden = items.length > 0;

      const remaining = state.todos.filter((t) => !t.done).length;
      const total = state.todos.length;
      counterEl.textContent = total === 0
        ? ""
        : `${remaining} of ${total} remaining`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      addTodo(input.value);
      input.value = "";
      input.focus();
    });

    filtersEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter");
      if (!btn) return;
      setFilter(btn.dataset.filter);
    });

    render();
  </script>
</body>
</html>
